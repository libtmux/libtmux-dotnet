version: 2

# Actions are pinned to commit SHAs, which is what stops a moved tag from
# changing what runs in CI. A pin nobody updates is just a stale action, so the
# pins are maintained here rather than by hand.
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Docs(deps[ci]) "

  # Central Package Management keeps every version in one file, so a single
  # grouped pull request is the whole dependency surface rather than a queue of
  # one-line changes. The lock files are regenerated by the build, and
  # restore --locked-mode fails the gate if a bump lands without them.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "dotnet(deps) "
    groups:
      dotnet:
        patterns: ["*"]

  # rollForward is disable, so the pin never moves on its own. .tool-versions
  # names the same version and has no updater, so move both together.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "dotnet(deps[sdk]) "
