# The gate. Everything a change has to pass locally runs here, in the same
# order and with the same flags, so a change that is green here and red there
# would make one of the two a lie.
name: dotnet

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build and prove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SourceLink points at the commit that produced the assembly, which
          # a shallow checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install tmux
        # The examples, the ahead-of-time smoke test and the package consumer
        # all drive a real server rather than a stub.
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: Restore
        run: dotnet restore LibTmux.slnx --locked-mode

      - name: Format
        run: dotnet format LibTmux.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LibTmux.slnx --configuration Release --no-restore --warnaserror

      - name: Unit tests (net8.0)
        run: >
          dotnet test
          --project tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release
          --framework net8.0
          --no-build
          --minimum-expected-tests 1

      - name: Unit tests (net10.0)
        run: >
          dotnet test
          --project tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: Pack
        run: dotnet pack LibTmux.slnx --configuration Release --no-build --output artifacts/packages

      - name: Inspect the packages
        run: uv run python eng/parity/inspect_packages.py

      - name: Package consumer
        # Reaching the library through the package is the point: a missing
        # assembly or a wrong target framework is invisible from inside the
        # repository.
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-package-consumer
        run: |
          dotnet restore tests/LibTmux.PackageConsumer/LibTmux.PackageConsumer.csproj
          for framework in net8.0 net10.0; do
            dotnet run \
              --project tests/LibTmux.PackageConsumer/LibTmux.PackageConsumer.csproj \
              --configuration Release \
              --framework "${framework}" \
              --no-restore
          done

      - name: Ahead-of-time smoke test
        # Trim and ahead-of-time warnings are only complete once something is
        # published that way and run. This publishes where the closure tests
        # below look for it, which is the default location rather than one
        # this job picked.
        run: |
          sudo apt-get install --yes clang zlib1g-dev
          for framework in net8.0 net10.0; do
            dotnet publish tests/LibTmux.AotSmoke/LibTmux.AotSmoke.csproj \
              --configuration Release \
              --framework "${framework}" \
              --runtime linux-x64
            "tests/LibTmux.AotSmoke/bin/Release/${framework}/linux-x64/native/LibTmux.AotSmoke"
          done

      - name: Examples
        # An ordinary-tmux example that stopped working should fail here,
        # before a reader copies it.
        run: >
          dotnet run
          --project examples/LibTmux.Examples/LibTmux.Examples.csproj
          --configuration Release
          --framework net10.0
          --no-build

      - name: Example tests
        # The ordinary-tmux examples run again, one test each, through the
        # same compiled surface a caller reads.
        run: >
          dotnet test
          --project tests/LibTmux.ExampleTests/LibTmux.ExampleTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: Integration tests
        # These run last because the packaging tests among them read what the
        # steps above produced: the package, the consumer, and the native
        # binary. The runner's tmux is whatever Ubuntu ships; which versions
        # are supported is proven by dotnet-tmux.yml, which builds each one.
        env:
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: >
          dotnet test
          --project tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: Documents
        # These run on checked-in documents rather than the build, so nothing
        # else would notice them drifting from the source. The snippet check is
        # the same idea aimed the other way: the documents are downstream of
        # code that runs, and this is what says so out loud.
        run: |
          uv run python eng/parity/verify_public_api.py
          uv run python eng/parity/render_public_api.py --check
          uv run python eng/parity/verify_capabilities.py
          uv run python eng/parity/verify_workflows.py
          uv run python eng/docs/render_api_reference.py --check
          uv run python eng/docs/sync_snippets.py --check
          uv run eng/mcp/dump_tools.py --check

      - name: Check out the pinned Python libtmux
        # The parity records quote one revision of the Python library. It is
        # cloned beside the workspace rather than into it, so nothing here
        # counts as part of this repository's tree.
        run: git clone --filter=blob:none --no-checkout https://github.com/tmux-python/libtmux "${RUNNER_TEMP}/python-libtmux"

      - name: Engineering tests
        env:
          LIBTMUX_PYTHON_REPOSITORY: ${{ runner.temp }}/python-libtmux
        # tomlkit is what mcp_swap edits Codex and Grok configs with, so its
        # tests need it too. There is no Python project file here to declare
        # it in — the scripts carry their own PEP 723 headers.
        run: uv run --with pytest --with tomlkit python -m pytest eng --quiet

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A run that failed before packing has nothing to upload, and saying so
        # twice would bury which step actually failed.
        if: always()
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: warn

  # macOS exercises the advertised platform but stays advisory; failures remain
  # visible without making the primary Linux gate depend on hosted macOS.
  macos:
    name: macos arm64 (advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - name: Restore
        # Locked mode is off here, and omitting --locked-mode is not enough to
        # do that: Directory.Build.props turns RestoreLockedMode on whenever CI
        # is set. The lock files are generated for the Linux runtime identifier
        # this repository publishes ahead of time, so a macOS restore resolves
        # osx-arm64 and NU1004s against them -- which is the lock files being
        # right about Linux, not a dependency problem.
        run: dotnet restore LibTmux.slnx -p:RestoreLockedMode=false

      - name: Build
        run: dotnet build LibTmux.slnx --configuration Release --no-restore --warnaserror

      - name: Unit tests
        run: >
          dotnet test tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release --no-build --framework net10.0
          -- --minimum-expected-tests 200

      - name: Integration tests
        # This is the part that could only ever be guessed at before: real tmux,
        # started and driven on a platform whose process and socket behaviour is
        # not Linux's.
        env:
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        # The packaging tests read what a pack produced and this lane does not
        # pack: packaging is a property of the artifacts, which are built and
        # proven once on Linux, not of the platform driving tmux.
        run: >
          dotnet test tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj
          --configuration Release --no-build --framework net10.0
          -- --filter-not-class '*PackageClosureTests*' --minimum-expected-tests 400

  # One name for branch protection to require. Without it, every job added here
  # has to be added to the protection rule too, and a job nobody remembered to
  # require is a job that can fail without blocking anything.
  gate:
    name: gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report whether everything this workflow gates on passed
        # A skipped or cancelled dependency is not a pass. Comparing against
        # 'success' rather than checking for 'failure' is what makes that true
        # for statuses nobody has invented yet.
        run: |
          failed=0
          for pair in "build:${{ needs.build.result }}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "${name}: ${result}"
            [ "$result" = "success" ] || failed=1
          done
          exit "$failed"
