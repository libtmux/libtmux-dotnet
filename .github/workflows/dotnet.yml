# The gate. Everything a change has to pass locally runs here, in the same
# order and with the same flags, so a change that is green here and red there
# would make one of the two a lie.
name: dotnet

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Open a restricted SSH session after the macOS job
        default: false

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build and prove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SourceLink points at the commit that produced the assembly, which
          # a shallow checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          version="$(awk '$1 == "actionlint" {print $2}' .tool-versions)"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "${RUNNER_TEMP}/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
          uv run --locked --script eng/parity/verify_workflows.py

      - name: Install tmux
        # The examples, the ahead-of-time smoke test and the package consumer
        # all drive a real server rather than a stub.
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: Restore
        run: dotnet restore LibTmux.slnx --locked-mode

      - name: Restore F# tools
        run: dotnet tool restore

      # dotnet format cannot load F# project sources; compile the benchmark's
      # F# reference in its default Debug configuration before analysis.
      - name: Build format references
        run: >
          dotnet build benchmarks/LibTmux.Benchmarks/LibTmux.Benchmarks.csproj
          --configuration Debug --no-restore --warnaserror

      - name: Format
        run: dotnet format LibTmux.slnx --verify-no-changes --no-restore

      - name: F# formatting
        id: fsharp-format
        run: dotnet fantomas check src examples tests eng

      - name: Build
        run: dotnet build LibTmux.slnx --configuration Release --no-restore --warnaserror

      - name: Unit tests (net8.0)
        run: >
          dotnet test
          --project tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release
          --framework net8.0
          --no-build
          --minimum-expected-tests 1

      - name: Unit tests (net10.0)
        run: >
          dotnet test
          --project tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: F# unit tests (net8.0)
        id: fsharp-unit-net8
        run: >
          dotnet test
          --project tests/LibTmux.FSharp.Tests/LibTmux.FSharp.Tests.fsproj
          --configuration Release
          --framework net8.0
          --no-build
          --minimum-expected-tests 1

      - name: F# unit tests (net10.0)
        id: fsharp-unit-net10
        run: >
          dotnet test
          --project tests/LibTmux.FSharp.Tests/LibTmux.FSharp.Tests.fsproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: Native MCP swap tests
        run: >
          dotnet test
          --project eng/mcp-swap/tests/LibTmux.McpSwap.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 119

      - name: Compiler API inventory
        run: >
          dotnet run
          --project eng/LibTmux.Engineering
          --configuration Release
          --no-build
          -- api-inventory . artifacts/api-inventory.json

      - name: Pack
        run: dotnet pack LibTmux.slnx --configuration Release --no-build --output artifacts/packages

      - name: Inspect the packages
        run: >
          dotnet eng/LibTmux.Engineering/bin/Release/net10.0/LibTmux.Engineering.dll
          packages . artifacts/packages artifacts/api-inventory.json

      - name: Package mutation tests
        env:
          LIBTMUX_PACKAGE_ARTIFACTS: artifacts/packages
        run: uv run --locked --script eng/run_tests.py --quiet -m packaging

      - name: Install and inspect the workspace CLI
        run: |
          version=$(dotnet msbuild src/LibTmux.Workspace.Cli/LibTmux.Workspace.Cli.csproj -getProperty:Version)
          dotnet tool install LibTmux.Workspace.Cli \
            --tool-path "${RUNNER_TEMP}/workspace-cli" \
            --source "${PWD}/artifacts/packages" \
            --version "${version}"
          "${RUNNER_TEMP}/workspace-cli/tmux-workspace" --generate reference --json > "${RUNNER_TEMP}/workspace-commands.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          tree = json.loads((Path(os.environ["RUNNER_TEMP"]) / "workspace-commands.json").read_text())
          assert len(tree["commands"]) == 9
          imports = next(node for node in tree["commands"] if node["name"] == "import")
          assert len(imports["commands"]) == 2
          PY

      - name: Package consumer
        # Reaching the library through the package is the point: a missing
        # assembly or a wrong target framework is invisible from inside the
        # repository.
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-package-consumer
        run: |
          dotnet restore tests/LibTmux.PackageConsumer/LibTmux.PackageConsumer.csproj \
            --configfile tests/NuGet.config
          for framework in net8.0 net10.0; do
            dotnet run \
              --project tests/LibTmux.PackageConsumer/LibTmux.PackageConsumer.csproj \
              --configuration Release \
              --framework "${framework}" \
              --no-restore
          done

      - name: F# package consumer
        id: fsharp-package-consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-package-consumer
        run: |
          dotnet restore tests/LibTmux.FSharp.PackageConsumer/LibTmux.FSharp.PackageConsumer.fsproj \
            --configfile tests/NuGet.config
          for framework in net8.0 net10.0; do
            dotnet run \
              --project tests/LibTmux.FSharp.PackageConsumer/LibTmux.FSharp.PackageConsumer.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --no-restore
          done

      # An F# application compiles against its own SDK's FSharp.Core, so the
      # package has to load with the oldest one a supported SDK supplies.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.4xx'

      - name: F# SDK 8 consumer
        id: fsharp-sdk8-consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-sdk8-consumer
        working-directory: tests/LibTmux.FSharp.Sdk8Consumer
        run: |
          dotnet --version | grep --quiet '^8\.0\.4'
          dotnet restore --configfile ../NuGet.config
          env -u TMUX -u TMUX_PANE dotnet run --configuration Release --no-restore

      - name: F# README quickstart
        id: fsharp-readme-quickstart
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-quickstart
          TMUX_TMPDIR: ${{ runner.temp }}/fsharp-quickstart-tmux
        run: |
          mkdir -p "${TMUX_TMPDIR}"
          dotnet restore examples/LibTmux.FSharp.Quickstart/LibTmux.FSharp.Quickstart.fsproj \
            --configfile tests/NuGet.config \
            -p:UsePackageReferences=true
          dotnet build examples/LibTmux.FSharp.Quickstart/LibTmux.FSharp.Quickstart.fsproj \
            --configuration Release \
            --no-restore \
            -p:UsePackageReferences=true
          for framework in net8.0 net10.0; do
            # Built above, so only what the program prints reaches the comparison.
            printed="$(env -u TMUX -u TMUX_PANE dotnet run \
              --project examples/LibTmux.FSharp.Quickstart/LibTmux.FSharp.Quickstart.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --no-build \
              -p:UsePackageReferences=true)"
            printf '%s\n' "${printed}" | python3 eng/docs/sync_fsharp_snippets.py --expect-output Quickstart
          done

      - name: F# packed example console
        id: fsharp-packed-examples
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-packed-examples
          LIBTMUX_FSHARP_EXPECT_PACKED: '1'
        run: |
          dotnet restore examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
            --configfile tests/NuGet.config \
            -p:UsePackageReferences=true
          for framework in net8.0 net10.0; do
            dotnet run \
              --project examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --no-restore \
              -p:UsePackageReferences=true
          done
          python3 eng/docs/verify_api_examples.py \
            --packages artifacts/packages \
            --output "${RUNNER_TEMP}/libtmux-api-examples"

      - name: Ahead-of-time smoke test
        # Trim and ahead-of-time warnings are only complete once something is
        # published that way and run. The isolated cache and mapped source make
        # this a test of the packages above rather than the project graph.
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-aot-smoke
        run: |
          sudo apt-get install --yes clang zlib1g-dev
          dotnet restore tests/LibTmux.AotSmoke/LibTmux.AotSmoke.csproj \
            --runtime linux-x64 \
            --configfile tests/NuGet.config
          for framework in net8.0 net10.0; do
            dotnet publish tests/LibTmux.AotSmoke/LibTmux.AotSmoke.csproj \
              --configuration Release \
              --framework "${framework}" \
              --runtime linux-x64 \
              --no-restore
            "tests/LibTmux.AotSmoke/bin/Release/${framework}/linux-x64/native/LibTmux.AotSmoke"
          done

      - name: F# ahead-of-time smoke test
        id: fsharp-aot-smoke
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-aot-smoke
        run: |
          dotnet restore tests/LibTmux.FSharp.AotSmoke/LibTmux.FSharp.AotSmoke.fsproj \
            --runtime linux-x64 \
            --configfile tests/NuGet.config
          for framework in net8.0 net10.0; do
            dotnet publish tests/LibTmux.FSharp.AotSmoke/LibTmux.FSharp.AotSmoke.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --runtime linux-x64 \
              --no-restore
            "tests/LibTmux.FSharp.AotSmoke/bin/Release/${framework}/linux-x64/native/LibTmux.FSharp.AotSmoke"
          done

      - name: F# trimmed smoke test
        id: fsharp-trimmed-smoke
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/libtmux-fsharp-trimmed-smoke
        run: |
          dotnet restore tests/LibTmux.FSharp.AotSmoke/LibTmux.FSharp.AotSmoke.fsproj \
            --runtime linux-x64 \
            --configfile tests/NuGet.config \
            -p:PublishAot=false \
            -p:PublishTrimmed=true
          for framework in net8.0 net10.0; do
            dotnet publish tests/LibTmux.FSharp.AotSmoke/LibTmux.FSharp.AotSmoke.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --runtime linux-x64 \
              --no-restore \
              --output "${RUNNER_TEMP}/libtmux-fsharp-trimmed/${framework}" \
              -p:PublishAot=false \
              -p:PublishTrimmed=true
            "${RUNNER_TEMP}/libtmux-fsharp-trimmed/${framework}/LibTmux.FSharp.AotSmoke"
          done

      - name: F# example console
        id: fsharp-examples
        run: |
          for framework in net8.0 net10.0; do
            dotnet run \
              --project examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --no-build
          done

      - name: Example console smoke
        run: >
          dotnet run
          --project examples/LibTmux.Examples/LibTmux.Examples.csproj
          --configuration Release
          --framework net10.0
          --no-build
          -- --smoke

      - name: Example tests
        run: >
          dotnet test
          --project tests/LibTmux.ExampleTests/LibTmux.ExampleTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --minimum-expected-tests 1

      - name: README examples on both frameworks
        env:
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: |
          for framework in net8.0 net10.0; do
            dotnet test \
              --project tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj \
              --configuration Release \
              --framework "${framework}" \
              --no-build \
              --filter-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests \
              --minimum-expected-tests 1
          done

      - name: Integration tests
        env:
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: >
          dotnet test
          --project tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --filter-not-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests
          --minimum-expected-tests 1

      - name: Documents
        # These run on checked-in documents rather than the build, so nothing
        # else would notice them drifting from the source. The snippet check is
        # the same idea aimed the other way: the documents are downstream of
        # code that runs, and this is what says so out loud.
        run: |
          uv run python eng/parity/verify_public_api.py
          uv run python eng/parity/verify_capabilities.py
          uv run python eng/parity/verify_version_literals.py
          uv run python eng/parity/verify_tmux_versions.py
          uv run python eng/docs/render_api_reference.py --check
          uv run python eng/docs/render_api_reference.py --fsharp --check
          uv run python eng/docs/sync_snippets.py --check
          uv run python eng/docs/sync_fsharp_snippets.py --check
          uv run eng/mcp/dump_tools.py --check

      - name: F# member reference
        id: fsharp-fsdocs
        run: python3 eng/docs/sync_fsdocs_reference.py --check

      - name: Check out the pinned Python libtmux
        # The parity records quote one revision of the Python library. It is
        # cloned beside the workspace rather than into it, so nothing here
        # counts as part of this repository's tree.
        run: git clone --filter=blob:none --no-checkout https://github.com/tmux-python/libtmux "${RUNNER_TEMP}/python-libtmux"

      - name: Engineering tests
        env:
          LIBTMUX_PYTHON_REPOSITORY: ${{ runner.temp }}/python-libtmux
        # Naming pytest and tomlkit on the command line resolved whatever
        # released that morning, so an unrelated release could turn this red.
        # The runner declares them in its own PEP 723 header and pins them in
        # the lock beside it; --locked refuses to run against a stale one.
        run: uv run --locked --script eng/run_tests.py --quiet

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A run that failed before packing has nothing to upload, and saying so
        # twice would bury which step actually failed.
        if: always()
        with:
          name: packages
          path: |
            artifacts/packages
            artifacts/api-inventory.json
          if-no-files-found: error

  # macOS exercises the advertised platform but stays advisory; failures remain
  # visible without making the primary Linux gate depend on hosted macOS.
  macos:
    name: macos arm64 (advisory)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - name: Restore
        # Directory.Build.props enables locked mode in CI. This advisory macOS
        # lane opts out; the required Linux lanes remain the lock-file gate.
        run: dotnet restore LibTmux.slnx -p:RestoreLockedMode=false

      - name: Build
        run: dotnet build LibTmux.slnx --configuration Release --no-restore --warnaserror

      - name: F# example console
        run: |
          for framework in net8.0 net10.0; do
            dotnet run \
              --project examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
              --configuration Release \
              --framework "${framework}" \
              --no-build
          done

      - name: Unit tests
        run: >
          dotnet test tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release --no-build --framework net10.0
          -- --minimum-expected-tests 200

      - name: Native MCP swap tests
        run: >
          dotnet test eng/mcp-swap/tests/LibTmux.McpSwap.Tests.csproj
          --configuration Release --no-build --framework net10.0
          -- --minimum-expected-tests 119

      - name: Integration tests
        # This is the part that could only ever be guessed at before: real tmux,
        # started and driven on a platform whose process and socket behaviour is
        # not Linux's.
        env:
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: >
          dotnet test tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj
          --configuration Release --no-build --framework net10.0
          -- --minimum-expected-tests 400

      - name: Inspect the macOS runner
        id: debug
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: owenthereal/action-upterm@7df5fa550d6dc458335f4b2685452a0e42d0ba7e # v2.4.0
        with:
          detached: true
          limit-access-to-actor: true
          upterm-version: v0.32.1
          wait-timeout-minutes: 5

      - name: Save the restricted debug SSH address
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled && steps.debug.outputs.ssh-command != '' }}
        env:
          DEBUG_SSH_COMMAND: ${{ steps.debug.outputs.ssh-command }}
        run: printf '%s\n' "$DEBUG_SSH_COMMAND" > "$RUNNER_TEMP/debug-ssh-command.txt"

      - name: Retain the restricted debug connection
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled && steps.debug.outputs.ssh-command != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-connection
          path: ${{ runner.temp }}/debug-ssh-command.txt
          retention-days: 1
          if-no-files-found: error

  # Windows builds but does not run tmux, so this lane proves the half that a
  # Linux runner cannot: that the tree still compiles for a Windows consumer.
  # Most of the public surface is [UnsupportedOSPlatform("windows")], and a
  # consumer with warnings as errors meets CA1416 on nearly every call, so an
  # annotation lost here is a downstream build break. The build gates, unlike
  # the advisory macOS lane: before this, the only Windows coverage ran at
  # release time on a self-hosted runner, and a pull request could not see it.
  windows:
    name: windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        # The lock files are written on Linux and the required Linux lanes are
        # the lock-file gate, as they are for macOS.
        run: dotnet restore LibTmux.slnx -p:RestoreLockedMode=false

      - name: Build
        # The point of the lane. CA1416 is an error here under warnaserror.
        run: dotnet build LibTmux.slnx --configuration Release --no-restore --warnaserror

      - name: Unit tests
        # Advisory until one run says otherwise. [UnsupportedOSPlatform] is a
        # compile-time annotation, so a plain [Fact] inside an annotated class
        # runs here rather than skipping, and many do. The build above is what
        # this lane gates on; promote this step once a run shows it green.
        # Bounded on its own so a hang here fails this step instead of
        # cancelling the whole job past continue-on-error's reach.
        continue-on-error: true
        timeout-minutes: 5
        run: >
          dotnet test tests/LibTmux.UnitTests/LibTmux.UnitTests.csproj
          --configuration Release --no-build --framework net10.0
          -- --minimum-expected-tests 400

  # One name for branch protection to require. Without it, every job added here
  # has to be added to the protection rule too, and a job nobody remembered to
  # require is a job that can fail without blocking anything.
  gate:
    name: gate
    needs: [build, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject unsuccessful dependencies
        id: require-success
        if: ${{ always() && (needs.build.result != 'success' || needs.windows.result != 'success') }}
        run: exit 1
