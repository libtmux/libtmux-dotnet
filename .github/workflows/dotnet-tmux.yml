# The compatibility claim. The README and the package say which tmux versions
# this works on; each one is built from source here and driven for real, so the
# claim is something this repository can fail.
name: dotnet-tmux

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
  schedule:
    # tmux master moves under the library rather than with it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-tmux-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build integration assemblies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore integration dependencies
        run: dotnet restore tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj --locked-mode

      - name: Build both frameworks once
        run: >
          dotnet build tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj
          --configuration Release --no-restore --warnaserror

      - name: Archive runnable assemblies
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/integration-revision
          tar -czf artifacts/integration.tar.gz \
            artifacts/integration-revision \
            tests/LibTmux.IntegrationTests/bin/Release/net8.0 \
            tests/LibTmux.IntegrationTests/bin/Release/net10.0 \
            tests/LibTmux.TestChild/bin/Release/net8.0 \
            tests/LibTmux.TestChild/bin/Release/net10.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts/integration.tar.gz
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: build
    name: tmux ${{ matrix.tmux }} on ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One lane failing says something about that tmux version, which is only
      # readable when the other lanes still run.
      fail-fast: false
      matrix:
        tmux: ['3.2a', '3.3a', '3.4', '3.5', '3.6', '3.7a', '3.7b', '3.7c']
        framework: ['net8.0', 'net10.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            jq \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - name: Restore the tmux build
        id: tmux-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tmux
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ hashFiles('eng/tmux/build-version.sh') }}

      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: eng/tmux/build-version.sh "${TMUX_VERSION}" | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - name: Integration tests
        id: integration-tests
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_TMUX_SOURCE_COMMIT: ${{ steps.tmux.outputs.commit }}
          LIBTMUX_EXPECTED_TMUX_VERSION: ${{ matrix.tmux }}
          # A lane whose integration tests silently skipped would pass while
          # proving nothing at all.
          LIBTMUX_INTEGRATION_REQUIRED: '1'
          LIBTMUX_TEST_FRAMEWORK: ${{ matrix.framework }}
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        # Some of what is proven here runs tmux from inside tmux, the way a
        # user's configuration does, which finds it by name. The build under
        # test goes on the path so that inner tmux is the same one: the image
        # has no other, and reaching a different version would prove nothing
        # about this lane.
        #
        # Package checks and documentation run in the main build gate.
        # Each lane executes the same assemblies against a different tmux.
        run: |
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet test \
            --test-modules "tests/LibTmux.IntegrationTests/bin/Release/${MATRIX_FRAMEWORK}/LibTmux.IntegrationTests.dll" \
            --filter-not-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests \
            --minimum-expected-tests 800

  advisory:
    needs: build
    name: tmux master (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # What tmux master does is a question about time, not about a commit: it
    # moves under this library rather than with it. Running it weekly answers
    # that question and stops a lane that is expected to fail from putting a
    # red mark on every push, which costs a reader the time to check whether
    # this one matters.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            jq \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - name: Build tmux master
        id: tmux
        run: eng/tmux/build-version.sh master | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - name: Integration tests
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_TMUX_SOURCE_COMMIT: ${{ steps.tmux.outputs.commit }}
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: |
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet test \
            --test-modules tests/LibTmux.IntegrationTests/bin/Release/net10.0/LibTmux.IntegrationTests.dll \
            --filter-not-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests \
            --minimum-expected-tests 800

  # The matrix is what proves the compatibility range, so it needs one name to
  # require. The advisory lane is deliberately excluded: it tracks tmux master,
  # which can break for reasons that are not this library's problem.
  compatibility:
    name: compatibility
    needs: [build, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject unsuccessful dependencies
        id: require-success
        if: ${{ always() && (needs.build.result != 'success' || needs.matrix.result != 'success') }}
        run: exit 1
