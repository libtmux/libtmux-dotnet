# The compatibility claim. The README and the package say which tmux versions
# this works on; each one is built from source here and driven for real, so the
# claim is something this repository can fail.
name: dotnet-tmux

on:
  workflow_call:
    inputs:
      scope:
        description: How much of the tmux table to cover. The release workflow passes full.
        required: true
        type: string
  push:
    branches: [master]
  pull_request:
  schedule:
    # tmux master moves under the library rather than with it.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest tmux, full runs the whole table
          and the refusal lanes, custom runs the refs in tmux-ref.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      dotnet:
        description: Comma-separated target frameworks, such as net8.0,net10.0. Empty runs both.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: dotnet-tmux-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # What a run covers is decided here from eng/tmux/versions.json and the
  # event, so no job below carries a version list of its own. A push and a pull
  # request test the oldest and newest release; the whole table runs on the
  # schedule, at a release, and when a dispatch asks for it.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rejected: ${{ steps.plan.outputs.rejected }}
      exact_3_7: ${{ steps.plan.outputs.exact_3_7 }}
      advisory: ${{ steps.plan.outputs.advisory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/tmux

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          DOTNET: ${{ inputs.dotnet }}
        run: |
          python3 eng/tmux/plan.py \
            --event "${EVENT}" \
            --ref "${REF}" \
            --scope "${SCOPE}" \
            --tmux-ref "${TMUX_REF}" \
            --dotnet "${DOTNET}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  build:
    name: build integration assemblies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore integration dependencies
        run: |
          dotnet restore tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj --locked-mode
          dotnet restore tests/LibTmux.Workspace.Cli.Tests/LibTmux.Workspace.Cli.Tests.csproj --locked-mode

      - name: Build both frameworks once
        run: |
          dotnet build tests/LibTmux.IntegrationTests/LibTmux.IntegrationTests.csproj \
            --configuration Release --no-restore --warnaserror
          dotnet build tests/LibTmux.Workspace.Cli.Tests/LibTmux.Workspace.Cli.Tests.csproj \
            --configuration Release --no-restore --warnaserror

      - name: Build F# examples for the tmux matrix
        id: fsharp-examples-build
        run: |
          dotnet restore examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj --locked-mode
          dotnet build examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
            --configuration Release --no-restore --warnaserror
          for source in examples/LibTmux.FSharp.Examples/Programs/*.fs; do
            program="$(basename "${source}" .fs)"
            dotnet build examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj \
              --configuration Release --no-restore --warnaserror \
              -p:ExampleProgram="${program}"
          done

      - name: Build C# programs for the tmux matrix
        id: csharp-examples-build
        run: |
          dotnet restore examples/LibTmux.Examples/LibTmux.Examples.csproj --locked-mode
          for source in examples/LibTmux.Examples/Programs/*.cs; do
            program="$(basename "${source}" .cs)"
            dotnet build examples/LibTmux.Examples/LibTmux.Examples.csproj \
              --configuration Release --no-restore --warnaserror \
              -p:ExampleProgram="${program}"
          done

      - name: Archive runnable assemblies
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/integration-revision
          tar -czf artifacts/integration.tar.gz \
            artifacts/integration-revision \
            tests/LibTmux.IntegrationTests/bin/Release/net8.0 \
            tests/LibTmux.IntegrationTests/bin/Release/net10.0 \
            tests/LibTmux.Workspace.Cli.Tests/bin/Release/net8.0 \
            tests/LibTmux.Workspace.Cli.Tests/bin/Release/net10.0 \
            examples/LibTmux.FSharp.Examples/bin/Release/net8.0 \
            examples/LibTmux.FSharp.Examples/bin/Release/net10.0 \
            examples/LibTmux.FSharp.Examples/bin/Release/programs \
            examples/LibTmux.Examples/bin/Release/programs \
            src/LibTmux.Workspace.Cli/bin/Release/net8.0 \
            src/LibTmux.Workspace.Cli/bin/Release/net10.0 \
            tests/LibTmux.TestChild/bin/Release/net8.0 \
            tests/LibTmux.TestChild/bin/Release/net10.0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts/integration.tar.gz
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: [plan, build]
    name: tmux ${{ matrix.tmux }} on ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One lane failing says something about that tmux version, which is only
      # readable when the other lanes still run.
      fail-fast: false
      # The plan chooses the legs and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        # zsh drives the Workspace CLI tests' pane-readiness regression test:
        # the wait it guards once ran only for that shell, so the test still
        # exercises a real one to prove the generalized wait did not regress it.
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            jq \
            libevent-dev \
            libncurses-dev \
            pkg-config \
            zsh

      # A tag, branch or commit outside the table is built from source at the
      # commit it names. The commit is resolved first so that the cache key
      # holds it and never the branch name.
      - name: Resolve the tmux ref
        id: resolve
        if: matrix.kind == 'ref'
        env:
          TMUX_REF: ${{ matrix.tmux }}
        run: eng/tmux/build-version.sh --resolve "${TMUX_REF}" | tee -a "${GITHUB_OUTPUT}"

      - name: Restore the tmux build
        id: tmux-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tmux
          key: tmux-${{ matrix.kind == 'ref' && format('ref-{0}', steps.resolve.outputs.commit) || matrix.tmux }}-${{ runner.os }}-${{ hashFiles('eng/tmux/build-version.sh') }}

      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_KIND: ${{ matrix.kind }}
          TMUX_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if [[ "${TMUX_KIND}" == ref ]]; then
            eng/tmux/build-version.sh --ref "${TMUX_COMMIT}" | tee -a "${GITHUB_OUTPUT}"
          else
            eng/tmux/build-version.sh "${TMUX_VERSION}" | tee -a "${GITHUB_OUTPUT}"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Prepare the Python compatibility runtime
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/workspace-python"
          uv pip install --python "${RUNNER_TEMP}/workspace-python/bin/python" tmuxp==1.74.0
          echo "TMUX_WORKSPACE_PYTHON=${RUNNER_TEMP}/workspace-python/bin/python" >> "${GITHUB_ENV}"

      - name: Workspace CLI tests
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: |
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet test \
            --test-modules "tests/LibTmux.Workspace.Cli.Tests/bin/Release/${MATRIX_FRAMEWORK}/LibTmux.Workspace.Cli.Tests.dll" \
            --fail-skips on \
            --minimum-expected-tests 80

      - name: Integration tests
        id: integration-tests
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_TMUX_SOURCE_COMMIT: ${{ steps.tmux.outputs.commit }}
          # Empty for a ref, which is no release and has no version to match.
          LIBTMUX_EXPECTED_TMUX_VERSION: ${{ matrix.expected }}
          # A lane whose integration tests silently skipped would pass while
          # proving nothing at all.
          LIBTMUX_INTEGRATION_REQUIRED: '1'
          LIBTMUX_TEST_FRAMEWORK: ${{ matrix.framework }}
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        # Some of what is proven here runs tmux from inside tmux, the way a
        # user's configuration does, which finds it by name. The build under
        # test goes on the path so that inner tmux is the same one: the image
        # has no other, and reaching a different version would prove nothing
        # about this lane.
        #
        # Package checks and documentation run in the main build gate.
        # Each lane executes the same assemblies against a different tmux.
        run: |
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet test \
            --test-modules "tests/LibTmux.IntegrationTests/bin/Release/${MATRIX_FRAMEWORK}/LibTmux.IntegrationTests.dll" \
            --filter-not-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests \
            --minimum-expected-tests 800 \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini \
            --results-directory "${RUNNER_TEMP}/integration-results"

      # The suite takes about two minutes; a test still running after five is
      # hung, and the dump's log names it instead of the lane timing out mute.
      - name: Name a hung integration test
        if: failure() && steps.integration-tests.outcome == 'failure'
        run: cat "${RUNNER_TEMP}"/integration-results/dotnet_*_hang.log 2>/dev/null || echo "No integration test was hung."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.integration-tests.outcome == 'failure'
        with:
          name: integration-hang-${{ matrix.slug }}-${{ matrix.framework }}
          # Child processes get logs of their own, named for the process; a
          # tmux client's name has a colon, which artifacts cannot hold.
          path: ${{ runner.temp }}/integration-results/dotnet_*_hang.*
          if-no-files-found: ignore
          retention-days: 7

      - name: F# example
        id: fsharp-examples
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_EXPECTED_TMUX_VERSION: ${{ matrix.expected }}
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
          # Leave room for the socket name within Unix socket path limits.
          TMUX_TMPDIR: /tmp/libtmux-dotnet-test
        run: |
          mkdir -p "${TMUX_TMPDIR}"
          if [[ -n "${LIBTMUX_EXPECTED_TMUX_VERSION}" ]]; then
            test "$("${LIBTMUX_TMUX}" -V)" = "tmux ${LIBTMUX_EXPECTED_TMUX_VERSION}"
          fi
          # A ref names no release, so the programs' minimum is read from what was built.
          built="${LIBTMUX_EXPECTED_TMUX_VERSION:-$("${LIBTMUX_TMUX}" -V | sed -e 's/^tmux //' -e 's/^next-//')}"
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet "examples/LibTmux.FSharp.Examples/bin/Release/${MATRIX_FRAMEWORK}/LibTmux.FSharp.Examples.dll"
          for source in examples/LibTmux.FSharp.Examples/Programs/*.fs; do
            program="$(basename "${source}" .fs)"
            # The manifest names a release for each program that needs one.
            minimum="$(jq -r --arg id "fsharp-${program}" '.examples[] | select(.id == $id) | .requiresTmux // empty' examples/api/manifest.json)"
            if [[ -n "${minimum}" && "$(printf '%s\n' "${minimum}" "${built}" | sort -V | head -1)" != "${minimum}" ]]; then
              echo "skip ${program}: needs tmux ${minimum}"
              continue
            fi
            # Each program prints what it found; its guide shows what it must print.
            printed="$(dotnet "examples/LibTmux.FSharp.Examples/bin/Release/programs/${program}/${MATRIX_FRAMEWORK}/LibTmux.FSharp.Examples.dll")"
            printf '%s\n' "${printed}" | python3 eng/docs/sync_fsharp_snippets.py --expect-output "${program}"
          done

      - name: C# complete programs
        id: csharp-examples
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_EXPECTED_TMUX_VERSION: ${{ matrix.expected }}
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
          TMUX_TMPDIR: /tmp/libtmux-dotnet-test
        run: |
          mkdir -p "${TMUX_TMPDIR}"
          if [[ -n "${LIBTMUX_EXPECTED_TMUX_VERSION}" ]]; then
            test "$("${LIBTMUX_TMUX}" -V)" = "tmux ${LIBTMUX_EXPECTED_TMUX_VERSION}"
          fi
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          for source in examples/LibTmux.Examples/Programs/*.cs; do
            program="$(basename "${source}" .cs)"
            dotnet "examples/LibTmux.Examples/bin/Release/programs/${program}/${MATRIX_FRAMEWORK}/LibTmux.Examples.dll"
          done

  # A daemon below the floor must be refused before it is touched. The client
  # is the supported 3.3a build, which can speak to both older protocols. The
  # refusal does not depend on which tmux a push touches, so it runs where the
  # plan asks for the whole table.
  rejected:
    needs: [plan, build]
    if: needs.plan.outputs.rejected != '[]'
    name: tmux ${{ matrix.rejected-version }} is refused
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rejected-version: ${{ fromJSON(needs.plan.outputs.rejected) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            jq \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - name: Restore the tmux builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tmux
          key: tmux-unsupported-${{ matrix.rejected-version }}-${{ runner.os }}-${{ hashFiles('eng/tmux/build-version.sh') }}

      - name: Build the supported and the rejected tmux
        id: tmux
        env:
          REJECTED_VERSION: ${{ matrix.rejected-version }}
        run: |
          floor="$(eng/tmux/build-version.sh 3.3a | sed -n 's/^binary=//p')"
          rejected="$(eng/tmux/build-version.sh "${REJECTED_VERSION}" | sed -n 's/^binary=//p')"
          printf 'floor=%s\nrejected=%s\n' "${floor}" "${rejected}" | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - name: Refuse the unsupported daemon before any effect
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.floor }}
          LIBTMUX_FLOOR_TMUX: ${{ steps.tmux.outputs.floor }}
          LIBTMUX_REJECTED_TMUX: ${{ steps.tmux.outputs.rejected }}
          LIBTMUX_REJECTED_REQUIRED: '1'
          REJECTED_VERSION: ${{ matrix.rejected-version }}
          TMUX_TMPDIR: /tmp/libtmux-dotnet-test
        run: |
          mkdir -p "${TMUX_TMPDIR}"
          test "$("${LIBTMUX_REJECTED_TMUX}" -V)" = "tmux ${REJECTED_VERSION}"
          test "$("${LIBTMUX_TMUX}" -V)" = "tmux 3.3a"
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          # The control client needs 3.7, which this lane does not install,
          # so its hook test runs in the matrix. A client older than 3.2
          # rejects -N, so the two tests that run the rejected build as a
          # working client do not apply to a build before 3.2, and the tests
          # of what only such a build does do not apply to the others.
          case "${REJECTED_VERSION}" in
            3.0a|3.1c) skipped=('*reports_a_different_version' '*executable_that_would_start_it_is_below_the_minimum') ;;
            *) skipped=('*before_3_2*') ;;
          esac
          dotnet test \
            --test-modules tests/LibTmux.IntegrationTests/bin/Release/net10.0/LibTmux.IntegrationTests.dll \
            --filter-class LibTmux.IntegrationTests.Versioning.MinimumTmuxVersionTests \
            --filter-not-method '*Attaching_and_watching_through_a_control_client_fires_no_hook' "${skipped[@]}" \
            --fail-skips on \
            --minimum-expected-tests 10

  # Exactly tmux 3.7 is the one release that ends the server on an unnamed
  # break-pane and rejects a name with a colon or a period. The matrix runs 3.7a
  # to 3.7c, which do neither, so the tests that fire these commands at a real
  # 3.7 daemon skip there. This lane runs them and fails if any is skipped. It
  # needs that release and no other, so it runs where the plan asks for the
  # whole table.
  exact_3_7:
    needs: [plan, build]
    if: needs.plan.outputs.exact_3_7 == 'true'
    name: tmux 3.7 exactly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - name: Restore the tmux build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/tmux
          key: tmux-3.7-${{ runner.os }}-${{ hashFiles('eng/tmux/build-version.sh') }}

      - name: Build tmux 3.7
        id: tmux
        run: eng/tmux/build-version.sh 3.7 | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - name: Run the tests that need exactly 3.7
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_EXPECTED_TMUX_VERSION: '3.7'
          LIBTMUX_INTEGRATION_REQUIRED: '1'
          TMUX_TMPDIR: /tmp/libtmux-dotnet-test
        run: |
          mkdir -p "${TMUX_TMPDIR}"
          test "$("${LIBTMUX_TMUX}" -V)" = "tmux ${LIBTMUX_EXPECTED_TMUX_VERSION}"
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          # A test that skipped here would pass while proving nothing, so a
          # skip fails the lane, and so does a run of fewer tests than there
          # are, which a renamed test would cause.
          dotnet test \
            --test-modules tests/LibTmux.IntegrationTests/bin/Release/net10.0/LibTmux.IntegrationTests.dll \
            --filter-method '*exact_3_7*' \
            --fail-skips on \
            --minimum-expected-tests 3

  advisory:
    needs: [plan, build]
    name: tmux master (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # What tmux master does is a question about time, not about a commit: it
    # moves under this library rather than with it. Running it weekly answers
    # that question and stops a lane that is expected to fail from putting a
    # red mark on every push, which costs a reader the time to check whether
    # this one matters. The plan keeps it off a push and a pull request.
    if: needs.plan.outputs.advisory == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bison \
            build-essential \
            jq \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - name: Build tmux master
        id: tmux
        run: eng/tmux/build-version.sh master | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-${{ github.sha }}-Release
          path: artifacts

      - name: Extract the same-commit assemblies
        run: |
          tar -xzf artifacts/integration.tar.gz
          test "$(cat artifacts/integration-revision)" = "${GITHUB_SHA}"

      - name: Integration tests
        env:
          LIBTMUX_TMUX: ${{ steps.tmux.outputs.binary }}
          LIBTMUX_TMUX_SOURCE_COMMIT: ${{ steps.tmux.outputs.commit }}
          LIBTMUX_INTEGRATION_REQUIRED: '1'
        run: |
          PATH="$(dirname "${LIBTMUX_TMUX}"):${PATH}"
          export PATH
          dotnet test \
            --test-modules tests/LibTmux.IntegrationTests/bin/Release/net10.0/LibTmux.IntegrationTests.dll \
            --filter-not-class LibTmux.IntegrationTests.Documentation.ReadmeExampleTests \
            --minimum-expected-tests 800

  # The matrix is what proves the compatibility range, so it needs one name to
  # require. The advisory lane is deliberately excluded: it tracks tmux master,
  # which can break for reasons that are not this library's problem.
  #
  # A lane the plan left out of scope must be skipped and a lane it planned
  # must succeed. Accepting a skip for a planned lane would let a failure that
  # skips its dependents pass.
  compatibility:
    name: compatibility
    needs: [plan, build, exact_3_7, matrix, rejected]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject unsuccessful dependencies
        id: require-success
