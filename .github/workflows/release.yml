# Publishing waits for same-commit gates before nuget.org grants a token for
# its immutable feed.
#
# The name of this file is part of the trusted publishing policy on nuget.org.
# Renaming it means editing that policy, and until then no publish is possible.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag matches the version
        id: validate-tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != tag ] || [[ "${TAG}" != v* ]]; then
            echo "release must run at a v* tag, not ${REF_TYPE} ${TAG}" >&2
            exit 1
          fi
          version="$(dotnet msbuild src/LibTmux/LibTmux.csproj \
            -getProperty:Version -verbosity:quiet | tr -d '[:space:]')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "tag ${TAG} does not match version ${version}" >&2
            exit 1
          fi
          echo "validated ${TAG} at ${GITHUB_SHA}"

  dotnet:
    name: full dotnet gate
    needs: validate
    uses: ./.github/workflows/dotnet.yml

  compatibility:
    name: supported tmux matrix
    needs: validate
    uses: ./.github/workflows/dotnet-tmux.yml
    with:
      # A push runs the oldest and newest tmux. A release proves the table.
      scope: full

  publish:
    name: publish to nuget.org
    needs: [dotnet, compatibility]
    runs-on: ubuntu-latest
    # Most of this is waiting for nuget.org to validate and serve the push.
    timeout-minutes: 45

    # The policy on nuget.org names this environment, so a workflow that ran
    # outside it cannot exchange a token. It is also where a required reviewer
    # and a tag restriction belong.
    environment: nuget

    permissions:
      contents: read
      # Lets the job ask GitHub for the short-lived token nuget.org trades for
      # a one-hour API key. Nothing else here needs a credential.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SourceLink points a debugger at the commit that produced the
          # assembly, which a shallow checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the packages proved by the gate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Inspect the packages
        run: |
          dotnet restore eng/LibTmux.Engineering/LibTmux.Engineering.csproj --locked-mode
          dotnet run --project eng/LibTmux.Engineering --configuration Release --no-restore \
            -- packages . artifacts/packages artifacts/api-inventory.json

      - name: NuGet login
        # The key this returns lasts an hour, so it is asked for immediately
        # before it is used. One token buys exactly one key.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Unpack the packages for the SBOM
        # Syft's .NET catalogers read deps.json files and assembly metadata, not
        # the .nupkg archive around them, so scanning the packed files found
        # nothing and every SBOM before this one listed zero components.
        run: |
          set -euo pipefail
          for package in artifacts/packages/*.nupkg; do
            name="$(basename "${package}" .nupkg)"
            mkdir -p "artifacts/sbom-input/${name}"
            unzip -q "${package}" -d "artifacts/sbom-input/${name}"
          done

      - name: Generate an SBOM for the packages
        # A consumer deciding whether to take this needs to know what comes with
        # it. The SBOM describes the packed artifacts rather than the tree, so it
        # lists what actually ships.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # The file catalogers add one entry per file, named by its path, which
          # buries the packages and records where the runner unpacked them.
          SYFT_SELECT_CATALOGERS: '-file'
        with:
          path: artifacts/sbom-input
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          output-file: artifacts/sbom-cyclonedx.json

      - name: Prove the SBOM names every package
        # An SBOM with nothing in it passes every other check, which is how the
        # empty ones shipped. Each package is named from its own nuspec, so one
        # missing from the document stops the release before anything is pushed.
        run: |
          set -euo pipefail
          missing=0
          for package in artifacts/packages/*.nupkg; do
            # Read the nuspec whole, then match. A grep that stops at the first
            # match can kill unzip mid-write, and pipefail fails the release.
            nuspec="$(unzip -p "${package}" '*.nuspec')"
            id="$(grep -m 1 -oP '(?<=<id>)[^<]+' <<< "${nuspec}")"
            if ! jq -e --arg id "${id}" \
              'any(.components[]?; .type == "library" and .name == $id)' \
              artifacts/sbom-cyclonedx.json > /dev/null; then
              echo "::error::The SBOM does not name ${id}."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Attest what produced these packages
        # Signed provenance says which workflow, at which commit, on which
        # runner, built each file. Trusted publishing already proves the push
        # came from this repository; this proves the same about the bytes.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/packages/*.nupkg'

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json

      - name: Fetch the packages nuget.org serves
        # nuget.org adds a repository signature to every package it accepts,
        # which changes the bytes, so the attestation above cannot match the
        # file a consumer downloads. Wait until each is served, then keep it.
        run: |
          set -euo pipefail
          mkdir -p artifacts/published
          deadline=$((SECONDS + 1800))
          for package in artifacts/packages/*.nupkg; do
            nuspec="$(unzip -p "${package}" '*.nuspec')"
            id="$(grep -m 1 -oP '(?<=<id>)[^<]+' <<< "${nuspec}")"
            version="$(grep -m 1 -oP '(?<=<version>)[^<]+' <<< "${nuspec}")"
            base="https://api.nuget.org/v3-flatcontainer/${id,,}/${version,,}"
            published="artifacts/published/${id}.${version}.nupkg"
            until curl --fail --silent --location --output "${published}" "${base}/${id,,}.${version,,}.nupkg"; do
              if (( SECONDS > deadline )); then
                echo "::error::nuget.org did not serve ${id} ${version} within 30 minutes."
                exit 1
              fi
              sleep 30
            done
            # Listed whole first: grep -q exiting early can kill unzip, and
            # pipefail would report that as a missing signature.
            entries="$(unzip -Z1 "${published}")"
            if ! grep -qx '.signature.p7s' <<< "${entries}"; then
              echo "::error::nuget.org served ${id} ${version} without a repository signature."
              exit 1
            fi
          done

      - name: Attest the packages nuget.org serves
        # This is the attestation `gh attestation verify` finds for a package
        # downloaded from nuget.org.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/published/*.nupkg'
