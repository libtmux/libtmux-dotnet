width = 80
allow_ceiling = 5
shared_digest = "28b74bae1f7a06731fea5a150cbde4430179b7788b7564ea1644c3951df8531b"
checker_digest = "eb87afceb3fc8f11ef5a478cd38f901ef3950e89ff94fbe0ca281c0cfc1a0e2e"
markdown = ["**/*.md"]
sources = [
  "examples/**/*.cs",
  "examples/**/*.fs",
  "examples/**/*.csproj",
  "examples/**/*.fsproj",
  "examples/api/NuGet.config",
]
doc_comments = ["src/**/*.cs", "src/**/*.fs", "src/**/*.fsi"]

[[exclude]]
glob = "docs/decisions/**"
reason = "dated decision records and their evidence, not reader-facing examples"

[[exclude]]
glob = "docs/benchmarks/runs/**"
reason = "recorded benchmark runs; tables are measured output"

[[exclude]]
glob = "docs/fsharp-reference/**"
reason = "generated F# API reference, rewritten by the docs build"

[[exclude]]
glob = "docs/fsharp/reference/_template.md"
reason = "fsdocs template with no code fences"

[[exclude]]
glob = "examples/**/packages.lock.json"
reason = "NuGet lock files, generated by restore and not read for their code"

[[exclude]]
glob = "examples/api/manifest.json"
reason = "JSON index of the API examples, read by the docs scripts and tests, not read as code"

[[allow]]
path = ".github/WRITING.md"
line = "await using OwnedSessionScope session = await owned.Value.CreateOwnedSessionAsync("
reason = "the Bad example in the port block; it shows the width problem the Good example fixes"

[[allow]]
path = "examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj"
line = "    <NuGetLockFilePath>$(MSBuildProjectDirectory)/obj/package-mode.packages.lock.json</NuGetLockFilePath>"
reason = "MSBuild keeps whitespace inside property text, so the value cannot wrap"

[[allow]]
path = "examples/LibTmux.FSharp.Examples/LibTmux.FSharp.Examples.fsproj"
line = "    <LibTmuxPackageVersion Condition=\"'$(VersionSuffix)' != ''\">$(VersionPrefix)-$(VersionSuffix)</LibTmuxPackageVersion>"
reason = "MSBuild keeps whitespace inside property text, so the value cannot wrap; splitting the start tag instead would open the value line with >, which reads worse in a project a reader copies"

[[allow]]
path = "examples/LibTmux.FSharp.Quickstart/LibTmux.FSharp.Quickstart.fsproj"
line = "    <LibTmuxPackageVersion Condition=\"'$(VersionSuffix)' != ''\">$(VersionPrefix)-$(VersionSuffix)</LibTmuxPackageVersion>"
reason = "MSBuild keeps whitespace inside property text, so the value cannot wrap; splitting the start tag instead would open the value line with >, which reads worse in a project a reader copies"

[[allow]]
path = "examples/api/fsharp/Example.fsproj"
line = "    <DisableImplicitFSharpCoreReference>true</DisableImplicitFSharpCoreReference>"
reason = "the element and its value are 77 columns and its PropertyGroup indent makes 81; MSBuild keeps whitespace inside property text, so it cannot wrap"
