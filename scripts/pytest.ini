[pytest]
addopts = --doctest-modules --import-mode=importlib -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath =
    actionlint
    checks
    docs
    tmux-plan
    matrix-evidence
    benchmarks
    mcp-tools
    package-review
    wrapped-captures
    psmux-smoke
testpaths = .
markers =
    packaging: outer loop; mutates built Release archives and invokes the native inspector
